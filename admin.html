<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>우리동네 커피 - 관리자</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFFDF8;--bg2:#FBF5E6;--bg3:#F5EDD8;
  --text:#2C2218;--text2:#6B5D4D;--text3:#A0926F;
  --gold:#D4952B;--gold-soft:#E8B856;--gold-pale:#F5DFA7;--gold-ghost:#FBF3DC;
  --white:#FFFFFF;--border:#EDE5D6;--border2:#DDD3C0;
  --sans:'Outfit','Noto Sans KR',sans-serif;
  --kr:'Noto Sans KR','Outfit',sans-serif;
  --r:14px;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--sans);background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased}
a{text-decoration:none;color:inherit}img{display:block}
::selection{background:var(--gold-pale);color:var(--text)}

/* GATE */
#admin-gate{position:fixed;inset:0;background:rgba(44,34,24,.5);display:flex;align-items:center;justify-content:center;z-index:9999;backdrop-filter:blur(10px)}
#admin-gate.hidden{display:none}
.gate-box{background:var(--bg);border-radius:var(--r);padding:2.5rem;width:330px;text-align:center;box-shadow:0 24px 64px rgba(0,0,0,.12)}
.gate-box h2{font-family:var(--kr);font-size:1.3rem;font-weight:700;margin-bottom:.5rem}
.gate-box p{color:var(--text3);font-size:.8rem;margin-bottom:1.5rem}
.gate-box input{width:100%;border:1.5px solid var(--border);border-radius:10px;padding:.7rem;font-size:1rem;background:var(--white);margin-bottom:.7rem;outline:none;color:var(--text);text-align:center;letter-spacing:4px}
.gate-box input:focus{border-color:var(--gold)}
.gate-btn{width:100%;padding:.75rem;background:var(--gold);color:white;border:none;border-radius:10px;font-size:.92rem;cursor:pointer;font-family:var(--sans)}
.gate-btn:hover{background:#C08524}
.gate-err{color:#c0392b;font-size:.8rem;margin-top:.5rem;display:none}

/* ADMIN LAYOUT */
.admin-wrap{display:flex;min-height:100vh;display:none}
.admin-sb{width:230px;background:var(--text);color:white;padding:1.5rem 0;position:fixed;top:0;bottom:0;left:0;overflow-y:auto}
.admin-logo{padding:0 1.5rem 1.5rem;font-family:var(--kr);font-size:1.1rem;font-weight:700;border-bottom:1px solid rgba(255,255,255,.1);margin-bottom:.8rem;color:var(--gold-soft)}
.admin-logo small{display:block;font-size:.65rem;font-family:var(--sans);opacity:.4;margin-top:.1rem;color:white}
.admin-nav{list-style:none}
.admin-nav a{display:flex;align-items:center;gap:.7rem;padding:.65rem 1.5rem;color:rgba(255,255,255,.45);font-size:.83rem;transition:all .2s}
.admin-nav a:hover,.admin-nav a.active{background:rgba(255,255,255,.07);color:white}
.ic{font-size:1rem}
.admin-body{margin-left:230px;padding:2rem;min-height:100vh;background:var(--bg)}
.admin-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.5rem}
.admin-top h1{font-family:var(--kr);font-size:1.3rem;font-weight:700}
.btn-home{padding:.45rem 1rem;border-radius:10px;font-size:.78rem;cursor:pointer;font-family:var(--sans);border:1px solid var(--border);background:transparent;color:var(--text3);transition:all .3s;display:inline-flex;align-items:center;gap:.4rem}
.btn-home:hover{border-color:var(--gold);color:var(--gold)}
.admin-sec{display:none}.admin-sec.active{display:block}
.a-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:.8rem;margin-bottom:1.2rem}
.a-card{background:var(--white);border-radius:12px;padding:1.1rem;border:1px solid var(--border)}
.a-card .val{font-family:var(--sans);font-size:1.7rem;color:var(--gold);font-weight:800}
.a-card .lab{font-size:.75rem;color:var(--text3);margin-top:.15rem}
.a-panel{background:var(--white);border-radius:12px;padding:1.4rem;border:1px solid var(--border);margin-bottom:1.2rem}
.a-panel h3{font-size:.9rem;font-weight:700;color:var(--text);margin-bottom:.8rem}
.upload-zone{border:2px dashed var(--border);border-radius:10px;padding:1.5rem;text-align:center;cursor:pointer;transition:all .2s;margin-bottom:.8rem}
.upload-zone:hover{border-color:var(--gold);background:var(--gold-ghost)}
.upload-zone span{font-size:1.5rem;display:block;margin-bottom:.2rem}
.upload-zone p{color:var(--text3);font-size:.8rem}
.img-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:.5rem}
.img-thumb{aspect-ratio:1;border-radius:8px;overflow:hidden;position:relative;background:var(--bg3)}
.img-thumb img{width:100%;height:100%;object-fit:cover}
.img-thumb .del{position:absolute;top:2px;right:2px;background:rgba(0,0,0,.5);color:white;border:none;border-radius:50%;width:18px;height:18px;font-size:10px;cursor:pointer;display:none;align-items:center;justify-content:center}
.img-thumb:hover .del{display:flex}
.form-g{margin-bottom:.8rem}
.form-g label{display:block;font-size:.75rem;font-weight:500;color:var(--text3);margin-bottom:.3rem}
.form-g input,.form-g select,.form-g textarea{width:100%;border:1.5px solid var(--border);border-radius:10px;padding:.6rem .8rem;font-size:.82rem;font-family:var(--sans);outline:none;color:var(--text);background:var(--bg)}
.form-g input:focus,.form-g textarea:focus{border-color:var(--gold)}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:.8rem;margin-bottom:.8rem}
.btn-save{background:var(--gold);color:white;border:none;padding:.65rem 1.6rem;border-radius:10px;cursor:pointer;font-size:.85rem;font-family:var(--sans)}
.btn-save:hover{background:#C08524}
.btn-add{display:inline-flex;align-items:center;gap:.3rem;background:var(--text);color:white;border:none;padding:.55rem 1rem;border-radius:8px;cursor:pointer;font-size:.82rem;font-family:var(--sans);margin-top:.6rem}
.btn-add:hover{background:var(--gold)}
.btn-del{background:none;border:none;color:#c0392b;cursor:pointer;font-size:.95rem}
.menu-row{display:grid;grid-template-columns:50px 1fr 65px 65px 75px 72px 28px;gap:.35rem;align-items:center;padding:.55rem 0;border-bottom:1px solid var(--border)}
.menu-row-header{display:grid;grid-template-columns:50px 1fr 65px 65px 75px 72px 28px;gap:.35rem;padding:.4rem 0;border-bottom:2px solid var(--border);font-size:.6rem;color:var(--text3);font-weight:600;letter-spacing:.5px}
.menu-row-img{width:50px;height:50px;border-radius:8px;background:var(--bg3);display:flex;align-items:center;justify-content:center;font-size:1.1rem;cursor:pointer;overflow:visible;position:relative}
.menu-row-img img{width:100%;height:100%;object-fit:cover;border-radius:8px}
.menu-row-img .mi-overlay{position:absolute;inset:0;background:rgba(0,0,0,.5);display:none;border-radius:8px;flex-direction:column;align-items:center;justify-content:center;gap:2px;z-index:2}
.menu-row-img:hover .mi-overlay{display:flex}
.menu-row-img .mi-btn{font-size:.55rem;color:white;cursor:pointer;padding:2px 6px;border-radius:4px;border:none;font-family:var(--sans)}
.menu-row-img .mi-btn.upload{background:var(--gold)}
.menu-row-img .mi-btn.del{background:#c0392b}
.menu-row-img{position:relative}
.m-input{width:100%;border:1.5px solid var(--border);border-radius:6px;padding:.35rem .55rem;font-size:.8rem;font-family:var(--sans);outline:none}
.m-input:focus{border-color:var(--gold)}
.app-row{display:grid;grid-template-columns:44px 1fr 1fr auto;gap:.5rem;align-items:center;padding:.6rem 0;border-bottom:1px solid var(--border)}
.app-icon-pick{width:38px;height:38px;border-radius:10px;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:1.1rem;cursor:pointer;border:1.5px solid var(--border)}
.emoji-pick{position:relative}
.emoji-grid{position:absolute;top:44px;left:0;background:white;border:1px solid var(--border);border-radius:10px;padding:.4rem;display:none;grid-template-columns:repeat(6,1fr);gap:.2rem;z-index:10;box-shadow:0 8px 20px rgba(0,0,0,.07)}
.emoji-grid.open{display:grid}
.emoji-grid button{width:30px;height:30px;border:none;border-radius:6px;background:transparent;cursor:pointer;font-size:1rem}
.emoji-grid button:hover{background:var(--bg2)}
.notice-row{display:grid;grid-template-columns:1fr auto auto;gap:.5rem;align-items:center;padding:.55rem 0;border-bottom:1px solid var(--border)}
.switch{position:relative;width:36px;height:19px;display:inline-block}
.switch input{opacity:0;width:0;height:0}
.slider{position:absolute;inset:0;background:var(--border2);border-radius:19px;cursor:pointer;transition:.3s}
.slider::before{content:'';position:absolute;width:13px;height:13px;left:3px;top:3px;background:white;border-radius:50%;transition:.3s}
.switch input:checked+.slider{background:var(--gold)}
.switch input:checked+.slider::before{transform:translateX(17px)}
.hours-edit-row{display:grid;grid-template-columns:45px 1fr 1fr auto;gap:.5rem;align-items:center;padding:.4rem 0;border-bottom:1px solid var(--border)}
#toast{position:fixed;bottom:2rem;left:50%;transform:translateX(-50%) translateY(80px);background:var(--text);color:var(--bg);padding:.7rem 1.4rem;border-radius:var(--r);font-size:.82rem;z-index:9000;transition:transform .3s;pointer-events:none}
#toast.show{transform:translateX(-50%) translateY(0)}
@media(max-width:768px){.admin-sb{width:48px}.admin-sb .admin-logo,.admin-sb .admin-nav a span:not(.ic){display:none}.admin-sb .admin-nav a{justify-content:center;padding:.65rem}.admin-body{margin-left:48px;padding:.8rem}}
</style>
</head>
<body>
<div id="admin-gate">
  <div class="gate-box">
    <h2>🔐 관리자 로그인</h2>
    <p>비밀번호를 입력하세요</p>
    <input type="password" id="gate-pw" maxlength="10" onkeydown="if(event.key==='Enter')checkPw()">
    <p class="gate-err" id="gate-err">비밀번호가 올바르지 않습니다</p>
    <button class="gate-btn" onclick="checkPw()">확인</button>
  </div>
</div>
<div id="toast"></div>
<input type="file" id="file-input" accept="image/*" multiple style="display:none">

<div class="admin-wrap" id="admin-panel">
<div class="admin-sb">
  <div class="admin-logo">☕ 관리자<small>카페 관리</small></div>
  <ul class="admin-nav">
    <li><a href="#" class="active" data-sec="dash" onclick="showSec('dash',this)"><span class="ic">📊</span><span>대시보드</span></a></li>
    <li><a href="#" data-sec="photos" onclick="showSec('photos',this)"><span class="ic">🖼️</span><span>사진</span></a></li>
    <li><a href="#" data-sec="menus" onclick="showSec('menus',this)"><span class="ic">☕</span><span>메뉴</span></a></li>
    <li><a href="#" data-sec="apps" onclick="showSec('apps',this)"><span class="ic">📱</span><span>주문앱</span></a></li>
    <li><a href="#" data-sec="notices" onclick="showSec('notices',this)"><span class="ic">📢</span><span>공지</span></a></li>
    <li><a href="#" data-sec="store" onclick="showSec('store',this)"><span class="ic">⚙️</span><span>설정</span></a></li>
  </ul>
</div>
<div class="admin-body">
  <div class="admin-top">
    <h1 id="admin-title">대시보드</h1>
    <a class="btn-home" href="index.html">← 홈페이지 보기</a>
  </div>
  <div class="admin-sec active" id="sec-dash">
    <div class="a-cards"><div class="a-card"><div class="val" id="d-menu">0</div><div class="lab">메뉴</div></div><div class="a-card"><div class="val" id="d-gallery">0</div><div class="lab">갤러리</div></div><div class="a-card"><div class="val" id="d-apps">0</div><div class="lab">주문앱</div></div><div class="a-card"><div class="val" id="d-notices">0</div><div class="lab">공지</div></div></div>
    <div class="a-panel"><h3>⚡ 빠른 작업</h3><div style="display:flex;gap:.5rem;flex-wrap:wrap"><button class="btn-add" onclick="showSec('photos',document.querySelector('[data-sec=photos]'))">🖼️ 사진</button><button class="btn-add" onclick="showSec('menus',document.querySelector('[data-sec=menus]'))">☕ 메뉴</button><button class="btn-add" onclick="showSec('apps',document.querySelector('[data-sec=apps]'))">📱 주문앱</button><button class="btn-add" onclick="showSec('notices',document.querySelector('[data-sec=notices]'))">📢 공지</button></div></div>
  </div>
  <div class="admin-sec" id="sec-photos"><div class="a-panel"><h3>🌟 히어로 (최대 4장)</h3><div class="upload-zone" onclick="trigUpload('hero')"><span>📤</span><p>업로드</p></div><div class="img-grid" id="a-hero-imgs"></div></div><div class="a-panel"><h3>🖼️ 갤러리</h3><div class="upload-zone" onclick="trigUpload('gallery')"><span>📤</span><p>업로드</p></div><div class="img-grid" id="a-gallery-imgs"></div></div><div class="a-panel"><h3>🏠 소개 (1장)</h3><div class="upload-zone" onclick="trigUpload('about')"><span>📤</span><p>업로드</p></div><div class="img-grid" id="a-about-imgs"></div></div></div>
  <div class="admin-sec" id="sec-menus"><div class="a-panel"><h3>메뉴</h3><div id="a-menu-list"></div><button class="btn-add" onclick="addMenu()">+ 추가</button></div></div>
  <div class="admin-sec" id="sec-apps"><div class="a-panel"><h3>주문앱</h3><div id="a-app-list"></div><button class="btn-add" onclick="addApp()">+ 추가</button></div></div>
  <div class="admin-sec" id="sec-notices"><div class="a-panel"><h3>공지</h3><div id="a-notice-list"></div><div style="display:flex;gap:.4rem;margin-top:.6rem"><input class="m-input" id="new-notice" placeholder="새 공지사항"><button class="btn-add" style="margin-top:0" onclick="addNotice()">추가</button></div></div></div>
  <div class="admin-sec" id="sec-store"><div class="a-panel"><h3>🎨 로고 설정</h3>
<div style="margin-bottom:1rem">
<p style="font-size:.78rem;color:var(--text3);margin-bottom:.6rem">네비게이션에 표시될 로고를 설정합니다.</p>
<div style="display:flex;gap:.5rem;margin-bottom:1rem">
<button id="logo-type-text" class="btn-add" style="margin:0" onclick="setLogoType('text')">✏️ 텍스트 로고</button>
<button id="logo-type-img" class="btn-add" style="margin:0" onclick="setLogoType('image')">🖼️ 이미지 로고</button>
</div>
<div id="logo-text-settings" style="display:none;padding:1rem;background:var(--bg);border-radius:10px;border:1px solid var(--border)">
<div class="form-g"><label>로고 텍스트</label><input id="s-logo-text" placeholder="우리동네 커피" onchange="updateTextLogo()"></div>
<p style="font-size:.7rem;color:var(--text3);margin-top:.3rem">💡 저장하기를 눌러야 적용됩니다</p>
</div>
<div id="logo-img-settings" style="display:none;padding:1rem;background:var(--bg);border-radius:10px;border:1px solid var(--border)">
<div style="display:flex;align-items:center;gap:1rem;margin-bottom:.5rem">
<div id="logo-preview" style="width:140px;height:56px;border-radius:8px;border:1.5px dashed var(--border);display:flex;align-items:center;justify-content:center;overflow:hidden;background:white;font-size:.75rem;color:var(--text3)">미리보기</div>
<div><button class="btn-add" style="margin:0" onclick="uploadLogo()">📤 업로드</button><br><button onclick="deleteLogo()" style="background:none;border:none;color:#c0392b;font-size:.72rem;cursor:pointer;margin-top:.3rem">삭제</button></div>
</div>
</div>
</div>
<input type="file" id="logo-input" accept="image/*" style="display:none" onchange="handleLogo(event)">
</div><div class="a-panel"><h3>기본 정보</h3><div class="form-row"><div class="form-g"><label>이름</label><input id="s-name"></div><div class="form-g"><label>전화</label><input id="s-phone"></div></div><div class="form-g"><label>주소</label><input id="s-addr"></div><div class="form-g"><label>주차</label><input id="s-parking"></div><div class="form-g"><label>인스타그램</label><input id="s-insta"></div></div><div class="a-panel"><h3>영업시간</h3><div id="a-hours-list"></div></div><div class="a-panel"><h3>문구</h3><div class="form-g"><label>태그</label><input id="s-htag"></div><div class="form-g"><label>제목 (줄바꿈 가능)</label><textarea id="s-htitle" rows="3" placeholder="바쁜 하루 속,&#10;잠시 쉬어가는&#10;공간"></textarea></div><div class="form-g"><label>설명</label><textarea id="s-hdesc" rows="2"></textarea></div><div class="form-g"><label>소개 제목</label><input id="s-atitle"></div><div class="form-g"><label>소개 내용</label><textarea id="s-adesc" rows="3"></textarea></div></div><button class="btn-save" onclick="saveStore()">💾 저장</button></div>
</div>
</div>

  var nameInp=document.createElement('input');
  nameInp.className='m-input';nameInp.value=item.name;
  nameInp.addEventListener('change',function(){uM(item.id,'name',this.value);});
  row.appendChild(nameInp);

  // Hot price
  var hotInp=document.createElement('input');
  hotInp.className='m-input';hotInp.type='number';hotInp.value=item.h;hotInp.style.color='#E85D3A';
  hotInp.addEventListener('change',function(){uM(item.id,'h',+this.value);});
  row.appendChild(hotInp);

  // Ice price
  var iceInp=document.createElement('input');
  iceInp.className='m-input';iceInp.type='number';iceInp.value=item.c;iceInp.style.color='#4A9BD9';
  iceInp.addEventListener('change',function(){uM(item.id,'c',+this.value);});
  row.appendChild(iceInp);

  // Category
  var catSel=document.createElement('select');
  catSel.className='m-input';
  [{v:'coffee',t:'COFFEE'},{v:'noncoffee',t:'NON COFFEE'},{v:'ade',t:'ADE/TEA'},{v:'dessert',t:'DESSERT'}].forEach(function(o){
    var opt=document.createElement('option');opt.value=o.v;opt.textContent=o.t;
    if(item.cat===o.v)opt.selected=true;
    catSel.appendChild(opt);
  });
  catSel.addEventListener('change',function(){uM(item.id,'cat',this.value);});
  row.appendChild(catSel);

  // Temp
  var tempSel=document.createElement('select');
  tempSel.className='m-input';tempSel.style.fontSize='.65rem';
  [{v:'both',t:'HOT+ICE'},{v:'hot',t:'HOT만'},{v:'ice',t:'ICE만'},{v:'none',t:'없음'}].forEach(function(o){
    var opt=document.createElement('option');opt.value=o.v;opt.textContent=o.t;
    if(item.temp===o.v||(o.v==='both'&&!item.temp))opt.selected=true;
    tempSel.appendChild(opt);
  });
  tempSel.addEventListener('change',function(){uM(item.id,'temp',this.value);});
  row.appendChild(tempSel);

  // Delete
  var delBtn=document.createElement('button');
  delBtn.className='btn-del';delBtn.textContent='🗑';
  delBtn.addEventListener('click',function(){dM(item.id);});
  row.appendChild(delBtn);

  el.appendChild(row);
});
}
function uM(id,k,v){const i=menu.findIndex(m=>m.id===id);if(i>=0){menu[i][k]=v;save();rAM();}}
function addMenu(){menu.push({id:Date.now(),name:'새 메뉴',desc:'설명',h:4000,c:4000,temp:'both',cat:'coffee',img:''});save();rAM();rD();}
function dM(id){menu=menu.filter(m=>m.id!==id);save();rAM();rD();}
function dMI(id){const i=menu.findIndex(m=>m.id===id);if(i>=0){menu[i].img='';save();rAM();toast('사진 삭제됨');}}
function uMI(id){const f=document.createElement('input');f.type='file';f.accept='image/*';f.onchange=e=>{const file=e.target.files[0];if(!file)return;const r=new FileReader();r.onload=ev=>{const i=menu.findIndex(m=>m.id===id);if(i>=0){menu[i].img=ev.target.result;save();rAM();}};r.readAsDataURL(file);};f.click();}
const AE=['🛵','📱','🍽️','📞','💚','🟡','🔵','🟠','📦','🏪','💳','🌐'];
function rAA(){const el=document.getElementById('a-app-list');el.innerHTML='';apps.forEach(a=>{const d=document.createElement('div');d.className='app-row';d.innerHTML='<div class="emoji-pick"><div class="app-icon-pick" onclick="tE('+a.id+')">'+a.icon+'</div><div class="emoji-grid" id="emojis-'+a.id+'">'+AE.map(e=>'<button onclick="pE('+a.id+',\''+e+'\')">'+e+'</button>').join('')+'</div></div><input class="m-input" value="'+a.name+'" onchange="uA('+a.id+',\'name\',this.value)"><input class="m-input" value="'+(a.url||'')+'" onchange="uA('+a.id+',\'url\',this.value)" placeholder="URL"><div style="display:flex;align-items:center;gap:.4rem"><label class="switch"><input type="checkbox" '+(a.enabled?'checked':'')+' onchange="uA('+a.id+',\'enabled\',this.checked)"><span class="slider"></span></label><button class="btn-del" onclick="dA('+a.id+')">🗑</button></div>';el.appendChild(d);});}
function tE(id){document.getElementById('emojis-'+id).classList.toggle('open');}
function pE(id,e){uA(id,'icon',e);document.getElementById('emojis-'+id).classList.remove('open');}
function uA(id,k,v){const i=apps.findIndex(a=>a.id===id);if(i>=0){apps[i][k]=v;save();rAA();}}
function addApp(){apps.push({id:Date.now(),icon:'📱',name:'새 앱',desc:'설명',url:'',enabled:true});save();rAA();rD();}
function dA(id){apps=apps.filter(a=>a.id!==id);save();rAA();rD();}
function rAN(){const el=document.getElementById('a-notice-list');el.innerHTML='';notices.forEach(n=>{const d=document.createElement('div');d.className='notice-row';d.innerHTML='<input class="m-input" value="'+n.text+'" onchange="uN('+n.id+',\'text\',this.value)"><label class="switch"><input type="checkbox" '+(n.active?'checked':'')+' onchange="uN('+n.id+',\'active\',this.checked)"><span class="slider"></span></label><button class="btn-del" onclick="dN('+n.id+')">🗑</button>';el.appendChild(d);});}
function uN(id,k,v){const i=notices.findIndex(n=>n.id===id);if(i>=0){notices[i][k]=v;save();rAN();}}
function addNotice(){const inp=document.getElementById('new-notice');const t=inp.value.trim();if(!t)return;notices.push({id:Date.now(),text:t,active:true});inp.value='';save();rAN();rD();}
function dN(id){notices=notices.filter(n=>n.id!==id);save();rAN();rD();}
function rAH(){const el=document.getElementById('a-hours-list');el.innerHTML='';S.hours.forEach((h,i)=>{const d=document.createElement('div');d.className='hours-edit-row';d.innerHTML='<strong style="font-size:.82rem">'+h.day+'</strong><input type="time" class="m-input" value="'+h.open+'" onchange="uH('+i+',\'open\',this.value)"'+(h.off?' disabled':'')+'><input type="time" class="m-input" value="'+h.close+'" onchange="uH('+i+',\'close\',this.value)"'+(h.off?' disabled':'')+'><label style="display:flex;align-items:center;gap:.2rem;font-size:.78rem;color:var(--text3);cursor:pointer;white-space:nowrap"><input type="checkbox" '+(h.off?'checked':'')+' onchange="uH('+i+',\'off\',this.checked);rAH()">휴무</label>';el.appendChild(d);});}
function uH(i,k,v){S.hours[i][k]=v;save();}
function fS(){document.getElementById('s-name').value=S.name||'';document.getElementById('s-phone').value=S.phone||'';document.getElementById('s-addr').value=S.addr||'';document.getElementById('s-parking').value=S.parking||'';document.getElementById('s-insta').value=S.insta||'';document.getElementById('s-htag').value=S.htag||'';document.getElementById('s-htitle').value=(S.htitle||'').replace(/\\n/g,'\n');document.getElementById('s-hdesc').value=(S.hdesc||'').replace(/\\n/g,'\n');document.getElementById('s-atitle').value=S.atitle||'';document.getElementById('s-adesc').value=S.adesc||'';}
function saveStore(){S.name=document.getElementById('s-name').value;S.phone=document.getElementById('s-phone').value;S.addr=document.getElementById('s-addr').value;S.parking=document.getElementById('s-parking').value;S.insta=document.getElementById('s-insta').value;S.htag=document.getElementById('s-htag').value;S.htitle=document.getElementById('s-htitle').value.replace(/\n/g,'\\n');S.hdesc=document.getElementById('s-hdesc').value.replace(/\n/g,'\\n');S.atitle=document.getElementById('s-atitle').value;S.adesc=document.getElementById('s-adesc').value;save();R();toast('저장 완료 ✓');}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500);}

function setLogoType(type){
document.getElementById('logo-text-settings').style.display=type==='text'?'block':'none';
document.getElementById('logo-img-settings').style.display=type==='image'?'block':'none';
document.getElementById('logo-type-text').style.background=type==='text'?'var(--gold)':'var(--text)';
document.getElementById('logo-type-img').style.background=type==='image'?'var(--gold)':'var(--text)';
}
function uploadLogo(){document.getElementById('logo-input').click();}
function handleLogo(e){const file=e.target.files[0];if(!file)return;const r=new FileReader();r.onload=ev=>{S.logo=ev.target.result;save();renderLogoPreview();toast('로고 이미지 업데이트 ✓');};r.readAsDataURL(file);e.target.value='';}
function deleteLogo(){S.logo='';save();renderLogoPreview();toast('로고 이미지 삭제됨');}
function updateTextLogo(){S.name=document.getElementById('s-logo-text').value||'우리동네 커피';document.getElementById('s-name').value=S.name;}
function renderLogoPreview(){
var el=document.getElementById('logo-preview');
if(el){if(S.logo&&S.logo.length>10){el.innerHTML='<img src="'+S.logo+'" style="max-width:100%;max-height:100%;object-fit:contain">';}else{el.innerHTML='미리보기';}}
var lt=document.getElementById('s-logo-text');if(lt)lt.value=S.name||'우리동네 커피';
if(S.logo&&S.logo.length>10){setLogoType('image');}else{setLogoType('text');}
}

// Auto-focus on load
setTimeout(()=>document.getElementById('gate-pw').focus(),200);

</script>
