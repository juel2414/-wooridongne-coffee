<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>관리자 페이지 - 우리동네커피</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root { --cream: #F5F0E8; --espresso: #2C1A0E; --caramel: #C8873A; --latte: #D4A96A; --foam: #FBF7F0; --mid: #6B4226; --text: #8B7355; --danger: #c0392b; --bg: #f8f4ef; --white: #ffffff; --border: rgba(44,26,14,0.12); --sidebar-w: 240px; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Noto Sans KR', sans-serif; background: var(--bg); color: var(--espresso); }

  #loginScreen { position: fixed; inset: 0; z-index: 999; background: var(--espresso); display: flex; align-items: center; justify-content: center; }
  .login-box { background: var(--cream); padding: 56px 48px; width: 420px; text-align: center; }
  .login-logo { font-size: 1.8rem; font-weight: 900; color: var(--espresso); margin-bottom: 8px; }
  .login-logo span { color: var(--caramel); }
  .login-input { width: 100%; padding: 14px 16px; border: 1.5px solid var(--border); margin-bottom: 24px; font-size: 1rem; outline: none; }
  .login-btn { width: 100%; padding: 15px; background: var(--espresso); color: var(--cream); border: none; cursor: pointer; font-weight: 700; }
  .login-error { color: var(--danger); font-size: 0.82rem; margin-top: 14px; display: none; }

  #adminApp { display: none; min-height: 100vh; }
  .admin-sidebar { position: fixed; top: 0; left: 0; bottom: 0; width: var(--sidebar-w); background: var(--espresso); display: flex; flex-direction: column; z-index: 10; }
  .sidebar-logo { padding: 28px 24px; font-size: 1.3rem; font-weight: 900; color: var(--cream); border-bottom: 1px solid rgba(245,240,232,0.1); }
  .sidebar-logo span { color: var(--caramel); }
  .sidebar-nav { flex: 1; padding: 20px 0; overflow-y: auto; }
  .sidebar-item { padding: 11px 24px; cursor: pointer; color: rgba(245,240,232,0.55); font-size: 0.85rem; border-left: 3px solid transparent; }
  .sidebar-item:hover { color: var(--cream); }
  .sidebar-item.active { background: rgba(200,135,58,0.15); color: var(--latte); border-left-color: var(--caramel); }
  
  .admin-main { margin-left: var(--sidebar-w); padding: 40px 48px; min-height: 100vh; position: relative; }
  .admin-page { display: none; } .admin-page.active { display: block; }
  .page-title { font-size: 1.8rem; font-weight: 700; margin-bottom: 30px; }

  .card { background: var(--white); border: 1px solid var(--border); padding: 28px 32px; margin-bottom: 24px; }
  .card-title { font-size: 0.85rem; font-weight: 700; margin-bottom: 20px; padding-bottom: 12px; border-bottom: 1px solid var(--border); }
  
  .form-row { margin-bottom: 18px; }
  .form-label { display: block; font-size: 0.78rem; font-weight: 600; margin-bottom: 7px; }
  .form-input, .form-select { width: 100%; padding: 10px 14px; border: 1.5px solid var(--border); font-size: 0.9rem; outline: none; }

  .btn { padding: 10px 22px; font-size: 0.8rem; font-weight: 700; cursor: pointer; border: none; }
  .btn-primary { background: var(--caramel); color: #fff; }
  .btn-danger { background: transparent; color: var(--danger); border: 1.5px solid var(--danger); padding: 7px 14px; }
  .btn-ghost { background: transparent; border: 1px solid var(--border); }

  .menu-admin-tabs { display: flex; gap: 0; margin-bottom: 24px; border: 1.5px solid var(--border); width: fit-content; }
  .menu-admin-tab { padding: 9px 20px; font-size: 0.78rem; font-weight: 600; cursor: pointer; border: none; background: transparent; color: var(--text); }
  .menu-admin-tab.active { background: var(--espresso); color: var(--cream); }

  .menu-item-row { display: grid; grid-template-columns: 80px 1fr 1fr auto auto; gap: 14px; align-items: center; padding: 14px 16px; background: var(--foam); border: 1px solid var(--border); margin-bottom:8px; }
  .menu-item-thumb { width: 80px; aspect-ratio: 16/9; background: #e8dfd4; overflow: hidden; }
  .menu-item-thumb img { width: 100%; height: 100%; object-fit: cover; }

  .gallery-admin-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 14px; margin-bottom: 20px; }
  .gallery-admin-item { position: relative; aspect-ratio: 16/9; overflow: hidden; background: #e8dfd4; }
  .gallery-admin-item img { width: 100%; height: 100%; object-fit: cover; }
  .gallery-admin-delete { position: absolute; top: 8px; right: 8px; width: 28px; height: 28px; background: rgba(192,57,43,0.85); color: #fff; border: none; cursor: pointer; font-weight: 700; }
  .gallery-add-btn { aspect-ratio: 16/9; border: 2px dashed var(--border); display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; position: relative; }
  .gallery-add-btn input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }

  .notice-admin-row { display: flex; align-items: center; gap: 14px; padding: 14px 16px; background: var(--foam); border: 1px solid var(--border); margin-bottom: 8px; }
  
  .img-upload-zone { border: 2px dashed var(--border); padding: 32px; text-align: center; cursor: pointer; position: relative; background: var(--foam); }
  .img-upload-zone.has-img { padding: 0; border-style: solid; }
  .img-upload-zone input { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%; }
  .img-upload-zone img { width: 100%; max-height: 260px; object-fit: cover; display: block; }
  .img-overlay { position: absolute; inset: 0; background: rgba(44,26,14,0.5); display: flex; align-items: center; justify-content: center; gap: 10px; opacity: 0; transition: opacity 0.2s; }
  .img-upload-zone.has-img:hover .img-overlay { opacity: 1; }

  .modal-overlay { position: fixed; inset: 0; background: rgba(44,26,14,0.5); z-index: 200; display: none; align-items: center; justify-content: center; }
  .modal-overlay.open { display: flex; }
  .modal { background: var(--white); width: 560px; padding: 36px 40px; }

  .toast { position: fixed; bottom: 32px; right: 32px; z-index: 9999; background: var(--espresso); color: var(--cream); padding: 14px 24px; transform: translateY(20px); opacity: 0; transition: all 0.3s; }
  .toast.show { transform: translateY(0); opacity: 1; }
  
  #processingLoader { position: fixed; inset: 0; background: rgba(255,255,255,0.85); z-index: 9999; display: none; flex-direction:column; align-items: center; justify-content: center; font-weight: 700; font-size: 1.2rem; color: var(--caramel); }
</style>
</head>
<body>

<div id="processingLoader">
  <span id="loadText">서버와 통신 중입니다. 잠시만 기다려주세요...</span>
</div>

<div id="loginScreen">

    <button class="login-btn" onclick="tryLogin()">로그인</button>

<div id="adminApp">
  <aside class="admin-sidebar">

  </aside>

  <main class="admin-main">
    <div class="admin-page active" id="page-menu">
      <div class="page-title">메뉴 관리</div>
      <div class="menu-admin-tabs" id="menuAdminTabs">
        <button class="menu-admin-tab active" data-cat="coffee">커피</button>
        <button class="menu-admin-tab" data-cat="nonCoffee">논커피</button>
        <button class="menu-admin-tab" data-cat="adeTea">에이드/티</button>
        <button class="menu-admin-tab" data-cat="dessert">디저트</button>

      <div class="card">
        <div id="menuItemList"></div>

    <div class="admin-page" id="page-gallery">

    </div>

    <div class="admin-page" id="page-notice">

        <div id="noticeAdminList"></div>

    <div class="admin-page" id="page-settings">

      <div class="card">
        <div class="form-row"><label class="form-label">카페 이름</label>
        <input type="text" class="form-input" id="setCafeName"><button class="btn btn-primary" style="margin-top:10px;" onclick="saveCafeName()">이름 저장</button></div>
      </div>
      <div class="card"><div class="card-title">메인 배경 사진</div>
        <div class="img-upload-zone" id="heroZone"><input type="file" accept="image/*" onchange="uploadSettingImg(event, 'cafe_hero_img', 'heroZone')"><div>업로드</div></div>
      </div>
      <div style="display:flex; gap:20px;">
        <div class="card" style="flex:1"><div class="card-title">소개 사진 1 (큰 것)</div>
          <div class="img-upload-zone" id="about1Zone"><input type="file" accept="image/*" onchange="uploadSettingImg(event, 'cafe_about_main', 'about1Zone')"><div>업로드</div></div>
        </div>
        <div class="card" style="flex:1"><div class="card-title">소개 사진 2 (작은 것)</div>
          <div class="img-upload-zone" id="about2Zone"><input type="file" accept="image/*" onchange="uploadSettingImg(event, 'cafe_about_accent', 'about2Zone')"><div>업로드</div></div>
        </div>
      </div>
    </div>
  </main>
</div>

<div class="modal-overlay" id="menuModal">
  <div class="modal">
    <h2 style="margin-bottom:20px;">메뉴 정보</h2>
    <div class="form-row"><label class="form-label">메뉴명 *</label><input type="text" class="form-input" id="m_name"></div>
    <div class="form-row"><label class="form-label">설명/옵션 (BEST 등)</label><input type="text" class="form-input" id="m_sub"></div>
    <div class="form-row"><label class="form-label">가격 *</label><input type="text" class="form-input" id="m_price"></div>
    <div class="form-row"><label class="form-label">사진 등록 (16:9 비율)</label>
      <div class="img-upload-zone" id="menuImgZone">
        <input type="file" accept="image/*" onchange="handleMenuImg(event)"><div>클릭하여 사진 선택</div>
      </div>
    </div>
    <div style="display:flex;justify-content:flex-end;gap:10px;margin-top:20px;">
      <button class="btn btn-ghost" onclick="closeModal('menuModal')">취소</button>
      <button class="btn btn-primary" onclick="saveMenu()">저장</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="noticeModal">
  <div class="modal">
    <h2 style="margin-bottom:20px;">공지 등록</h2>
    <div class="form-row"><label class="form-label">유형</label><select id="n_type" class="form-select"><option>공지</option><option>이벤트</option></select></div>
    <div class="form-row"><label class="form-label">제목 *</label><input type="text" class="form-input" id="n_title"></div>
    <div class="form-row"><label class="form-label">날짜</label><input type="date" class="form-input" id="n_date"></div>
    <div style="display:flex;justify-content:flex-end;gap:10px;margin-top:20px;">
      <button class="btn btn-ghost" onclick="closeModal('noticeModal')">취소</button>
      <button class="btn btn-primary" onclick="saveNotice()">저장</button>
    </div>
  </div>
</div>

<div class="toast" id="toast">저장되었습니다.</div>

<script>
const SUPA_URL = 'https://lyhwxnvkhlcdirejrpko.supabase.co';
const SUPA_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx5aHd4bnZraGxjZGlyZWpycGtvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAzMjk5ODUsImV4cCI6MjA5NTkwNTk4NX0.m4HhXOioAzep4-SLB5oy2RFBB9h6bHg4ieIK95UFtt4';
const HEADERS = { 'apikey': SUPA_KEY, 'Authorization': 'Bearer ' + SUPA_KEY, 'Content-Type': 'application/json' };

let menusData = []; let galleryData = []; let noticesData = [];
let currentMenuCat = 'coffee'; let editMenuId = null; let pendingMenuFile = null; let pendingMenuUrl = '';

function showLoad(show, text="서버와 통신 중입니다. 잠시만 기다려주세요...") { 
  document.getElementById('loadText').textContent = text;
  document.getElementById('processingLoader').style.display = show ? 'flex' : 'none'; 
}
function showToast(msg) { const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'), 2500); }
function closeModal(id) { document.getElementById(id).classList.remove('open'); }

function tryLogin() { if(document.getElementById('pwInput').value === '2414') { document.getElementById('loginScreen').style.display='none'; document.getElementById('adminApp').style.display='block'; initApp(); } else alert('비밀번호 오류'); }
document.querySelectorAll('.sidebar-item').forEach(el => el.addEventListener('click', e => {
  document.querySelectorAll('.sidebar-item').forEach(i=>i.classList.remove('active'));
  document.querySelectorAll('.admin-page').forEach(p=>p.classList.remove('active'));
  e.target.classList.add('active'); document.getElementById('page-'+e.target.dataset.page).classList.add('active');
}));

// 초기화 & 자동 세팅 (Seed) 로직

    // DB가 완전히 비어있을 경우 (첫 접속)
    if (m.length === 0 && g.length === 0 && s.length === 0 && n.length === 0) {
      showLoad(true, "초기 세팅(사진 및 메뉴 업로드)을 진행 중입니다! 창을 닫지 마세요...");

        { category: 'coffee', name: '바닐라라떼', sub_desc: 'Hot / Ice', price: '3,000원', image_url: '' },
        { category: 'coffee', name: '카라멜마끼야또', sub_desc: 'Hot / Ice', price: '3,300원', image_url: '' },
        { category: 'coffee', name: '카페모카', sub_desc: 'Hot / Ice', price: '3,300원', image_url: '' },
        { category: 'nonCoffee', name: '초코라떼', sub_desc: 'Hot / Ice', price: '3,000원', image_url: '' },
        { category: 'nonCoffee', name: '녹차라떼', sub_desc: 'Hot / Ice', price: '3,000원', image_url: '' },
        { category: 'nonCoffee', name: '고구마라떼', sub_desc: 'Hot / Ice', price: '3,000원', image_url: '' },
        { category: 'nonCoffee', name: '딸기라떼', sub_desc: 'Hot / Ice', price: '3,500원', image_url: '' },
        { category: 'nonCoffee', name: '우리동네 크림라떼', sub_desc: '⭐ BEST | Hot / Ice', price: '3,500원', image_url: '' },
        { category: 'adeTea', name: '자몽에이드', sub_desc: 'Ice', price: '3,200원', image_url: '' },
        { category: 'adeTea', name: '레몬에이드', sub_desc: 'Ice', price: '3,200원', image_url: '' },
        { category: 'adeTea', name: '유자차', sub_desc: 'Hot / Ice', price: '3,300원', image_url: '' },
        { category: 'adeTea', name: '자몽차', sub_desc: 'Hot / Ice', price: '3,300원', image_url: '' },
        { category: 'adeTea', name: '레몬차', sub_desc: 'Hot / Ice', price: '3,300원', image_url: '' },

        { category: 'adeTea', name: '쌍화차', sub_desc: '⭐ BEST | Hot / Ice', price: '4,000원', image_url: '' },

// 스토리지 파일 업로드
async function uploadToStorage(file) {
  const fileName = Date.now() + '_' + Math.random().toString(36).substring(7);
  const res = await fetch(`${SUPA_URL}/storage/v1/object/cafe-images/${fileName}`, {
    method: 'POST',
    headers: { 'apikey': SUPA_KEY, 'Authorization': 'Bearer ' + SUPA_KEY, 'Content-Type': file.type },
    body: file
  });
  if(res.ok) return `${SUPA_URL}/storage/v1/object/public/cafe-images/${fileName}`;
  return null;
}

// ─── 메뉴 ───
document.getElementById('menuAdminTabs').addEventListener('click', e => {
  if(!e.target.classList.contains('menu-admin-tab')) return;
  document.querySelectorAll('.menu-admin-tab').forEach(t=>t.classList.remove('active'));
  e.target.classList.add('active'); currentMenuCat = e.target.dataset.cat; renderMenu();
});

function renderMenu() {
  const list = document.getElementById('menuItemList'); list.innerHTML = '';
  menusData.filter(m => m.category === currentMenuCat).forEach(item => {
    list.innerHTML += `<div class="menu-item-row">
      <div class="menu-item-thumb">${item.image_url ? `<img src="${item.image_url}">` : '사진없음'}</div>
      <div><b>${item.name}</b><br><span style="font-size:0.8rem;color:#888;">${item.sub_desc||''}</span></div>
      <div style="color:var(--caramel)">${item.price}</div>
      <button class="btn btn-ghost" onclick="openMenuModal(${item.id})">수정</button>
      <button class="btn btn-danger" onclick="delMenu(${item.id})">삭제</button>
    </div>`;
  });
}

function openMenuModal(id = null) {
  editMenuId = id; pendingMenuFile = null; pendingMenuUrl = '';
  document.getElementById('menuImgZone').innerHTML = '<div>클릭하여 사진 변경</div>'; document.getElementById('menuImgZone').classList.remove('has-img');
  if(id) {
    const m = menusData.find(x => x.id === id);
    document.getElementById('m_name').value = m.name; document.getElementById('m_sub').value = m.sub_desc || ''; document.getElementById('m_price').value = m.price;
    if(m.image_url) { pendingMenuUrl = m.image_url; setImgPreview('menuImgZone', m.image_url, true); }
  } else { document.getElementById('m_name').value = ''; document.getElementById('m_sub').value = ''; document.getElementById('m_price').value = ''; }
  document.getElementById('menuModal').classList.add('open');
}

function handleMenuImg(e) {
  if(!e.target.files[0]) return;
  pendingMenuFile = e.target.files[0];
  setImgPreview('menuImgZone', URL.createObjectURL(pendingMenuFile), true);
}

async function saveMenu() {
  const name = document.getElementById('m_name').value;
  const price = document.getElementById('m_price').value;
  if(!name || !price) return alert("이름과 가격을 입력해주세요.");
  
  showLoad(true);
  try {
    let finalUrl = pendingMenuUrl;
    if(pendingMenuFile) finalUrl = await uploadToStorage(pendingMenuFile);
    const body = JSON.stringify({ category: currentMenuCat, name, sub_desc: document.getElementById('m_sub').value, price, image_url: finalUrl });
    
    if(editMenuId) await fetch(`${SUPA_URL}/rest/v1/menus?id=eq.${editMenuId}`, { method: 'PATCH', headers: HEADERS, body });
    else await fetch(`${SUPA_URL}/rest/v1/menus`, { method: 'POST', headers: HEADERS, body });
    
    closeModal('menuModal'); showToast("저장되었습니다."); await initApp();
  } catch(e) { alert("저장 실패"); }
  showLoad(false);
}

async function delMenu(id) { if(!confirm("삭제하시겠습니까?")) return; showLoad(true); await fetch(`${SUPA_URL}/rest/v1/menus?id=eq.${id}`, { method: 'DELETE', headers: HEADERS }); await initApp(); showToast("삭제 완료"); }

// ─── 갤러리 ───
function renderGallery() {
  const grid = document.getElementById('galleryAdminGrid'); grid.innerHTML = '';
  galleryData.forEach(item => { grid.innerHTML += `<div class="gallery-admin-item"><img src="${item.image_url}"><button class="gallery-admin-delete" onclick="delGallery(${item.id})">×</button></div>`; });
  grid.innerHTML += `<div class="gallery-add-btn"><input type="file" multiple accept="image/*" onchange="uploadGallery(event)">+ 사진 추가</div>`;
}

async function uploadGallery(e) {
  const files = Array.from(e.target.files); if(!files.length) return;
  showLoad(true);
  for(let file of files) {
    const url = await uploadToStorage(file);
    if(url) await fetch(`${SUPA_URL}/rest/v1/gallery`, { method: 'POST', headers: HEADERS, body: JSON.stringify({image_url: url}) });
  }
  await initApp(); showToast("갤러리 업로드 완료");
}

async function delGallery(id) { if(!confirm("사진을 삭제할까요?")) return; showLoad(true); await fetch(`${SUPA_URL}/rest/v1/gallery?id=eq.${id}`, { method: 'DELETE', headers: HEADERS }); await initApp(); showToast("삭제 완료"); }

// ─── 공지 ───
function renderNotice() {
  const list = document.getElementById('noticeAdminList'); list.innerHTML = '';
  noticesData.forEach(n => { list.innerHTML += `<div class="notice-admin-row"><span style="background:var(--caramel);color:#fff;padding:2px 6px;font-size:0.7rem;margin-right:10px;">${n.type}</span><div style="flex:1;">${n.title}</div><div style="font-size:0.8rem;color:#888;">${n.created_at}</div><button class="btn btn-danger" style="margin-left:10px;" onclick="delNotice(${n.id})">삭제</button></div>`; });
}

function openNoticeModal() { document.getElementById('n_date').value = new Date().toISOString().split('T')[0]; document.getElementById('noticeModal').classList.add('open'); }
async function saveNotice() {
  const title = document.getElementById('n_title').value; if(!title) return alert("제목 입력 필수!");
  showLoad(true);
  await fetch(`${SUPA_URL}/rest/v1/notices`, { method: 'POST', headers: HEADERS, body: JSON.stringify({ type: document.getElementById('n_type').value, title, created_at: document.getElementById('n_date').value.replaceAll('-', '.') }) });
  closeModal('noticeModal'); await initApp(); showToast("공지 등록 완료");
}
async function delNotice(id) { if(!confirm("삭제할까요?")) return; showLoad(true); await fetch(`${SUPA_URL}/rest/v1/notices?id=eq.${id}`, { method: 'DELETE', headers: HEADERS }); await initApp(); showToast("삭제 완료"); }

// ─── 설정 ───
async function saveSettingDB(key, value) { await fetch(`${SUPA_URL}/rest/v1/settings`, { method: 'POST', headers: { ...HEADERS, 'Prefer': 'resolution=merge-duplicates' }, body: JSON.stringify({ setting_key: key, setting_value: value }) }); }
async function saveCafeName() { showLoad(true); await saveSettingDB('cafe_name', document.getElementById('setCafeName').value); showLoad(false); showToast("이름 저장 완료"); }

function setImgPreview(zoneId, url, isMenu=false) {
  const zone = document.getElementById(zoneId);
  if(!url) { zone.innerHTML = '<div>업로드</div>'; zone.classList.remove('has-img'); return; }
  zone.classList.add('has-img');
  zone.innerHTML = `<img src="${url}">` + (isMenu ? `<input type="file" accept="image/*" onchange="handleMenuImg(event)">` : `<input type="file" accept="image/*" onchange="uploadSettingImg(event, '${zoneId.replace('Zone','')}', '${zoneId}')">`);
}

async function uploadSettingImg(e, dbKey, zoneId) {
  if(!e.target.files[0]) return;
  showLoad(true);
  const url = await uploadToStorage(e.target.files[0]);
  if(url) { await saveSettingDB(dbKey, url); setImgPreview(zoneId, url); showToast("사진 변경 완료"); }
  showLoad(false);
}
</script>
</body>
</html>
